</head>
<body>
    <!-- Skip to main content link for keyboard/screen reader users -->
    <a href="main.html" class="skip-link">Skip to portfolio</a>

    <!-- Film grain overlay -->
    <div class="film-grain" aria-hidden="true"></div>
    
    <!-- Cinematic letterbox bars -->
    <div class="letterbox letterbox-top" aria-hidden="true"></div>
    <div class="letterbox letterbox-bottom" aria-hidden="true"></div>

    <!-- Particle canvas -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <main class="landing-container" role="main">
        <div class="landing-frame" aria-hidden="true">
            <div class="corner-mark top-left"></div>
            <div class="corner-mark top-right"></div>
            <div class="corner-mark bottom-left"></div>
            <div class="corner-mark bottom-right"></div>
        </div>

        <div class="landing-content">
            <div class="subtitle-line">
                <span class="line-accent" aria-hidden="true"></span>
                <span class="subtitle-text">PORTFOLIO</span>
                <span class="line-accent" aria-hidden="true"></span>
            </div>
            <h1 class="name">Luyanda Jnr Zondi</h1>
            <p class="role-text">Developer &middot; Designer &middot; Photographer</p>
            <div class="loading-bar-container" role="progressbar" aria-label="Loading portfolio" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="loading-bar"></div>
            </div>
            <a href="main.html" class="enter-hint" role="button">Click anywhere to enter</a>
        </div>

        <div class="landing-footer">
            <span class="year-text">&copy; 2026</span>
            <span class="location-text">Durban, South Africa</span>
        </div>
    </main>

    <script>
        // Particle system - reduced count for better performance
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouse = { x: null, y: null };
            // Reduce particle count on mobile for performance
            const isMobile = window.innerWidth <= 768;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const particleCount = prefersReducedMotion ? 0 : (isMobile ? 50 : 80);

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.5 + 0.1
                };
            }

            function init() {
                resize();
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(createParticle());
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, i) => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(233, 214, 179, ${p.opacity})`;
                    ctx.fill();

                    // Connect nearby particles with lines (limit checks for performance)
                    const maxConnections = 5;
                    let connections = 0;
                    for (let j = i + 1; j < particles.length && connections < maxConnections; j++) {
                        const dx = p.x - particles[j].x;
                        const dy = p.y - particles[j].y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < 14400) { // 120^2, avoid sqrt
                            const dist = Math.sqrt(distSq);
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(233, 214, 179, ${0.06 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                            connections++;
                        }
                    }
                });
            if (!prefersReducedMotion) {
                requestAnimationFrame(drawParticles);
            }
        }

            window.addEventListener('resize', resize);
            init();
            if (!prefersReducedMotion) {
                drawParticles();
            }
        })();

        document.addEventListener('DOMContentLoaded', function() {
            const name = document.querySelector('.name');
            const subtitle = document.querySelector('.subtitle-line');
            const role = document.querySelector('.role-text');
            const loadingBar = document.querySelector('.loading-bar');
            const container = document.querySelector('.landing-container');
            const corners = document.querySelectorAll('.corner-mark');
            const hint = document.querySelector('.enter-hint');
            const footer = document.querySelector('.landing-footer');
            const progressBar = document.querySelector('.loading-bar-container');

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (prefersReducedMotion) {
                // Show everything instantly for users who prefer reduced motion
                corners.forEach(c => c.classList.add('animate-in'));
                subtitle.classList.add('animate-in');
                name.classList.add('animate-in');
                role.classList.add('animate-in');
                loadingBar.style.width = '100%';
                if (progressBar) progressBar.setAttribute('aria-valuenow', '100');
                hint.classList.add('animate-in');
                footer.classList.add('animate-in');
            } else {
                // Staggered cinematic entrance
                setTimeout(() => {
                    corners.forEach(c => c.classList.add('animate-in'));
                }, 300);

                setTimeout(() => {
                    subtitle.classList.add('animate-in');
                }, 600);

                setTimeout(() => {
                    name.classList.add('animate-in');
                }, 900);

                setTimeout(() => {
                    role.classList.add('animate-in');
                }, 1200);

                setTimeout(() => {
                    loadingBar.style.width = '100%';
                    if (progressBar) progressBar.setAttribute('aria-valuenow', '100');
                }, 1500);

                setTimeout(() => {
                    hint.classList.add('animate-in');
                    footer.classList.add('animate-in');
                }, 2500);
            }

            // Navigate on click/touch/keyboard -- no forced auto-redirect
            let navigating = false;
            function navigate() {
                if (navigating) return;
                navigating = true;
                container.classList.add('animate-out');
                setTimeout(() => {
                    window.location.href = "main.html";
                }, prefersReducedMotion ? 0 : 800);
            }
            document.addEventListener('click', navigate);
            document.addEventListener('touchend', navigate);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    navigate();
                }
            });
        });
    </script>
</body>
</html>
